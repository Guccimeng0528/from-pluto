<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From PLUTO — NamtanFilm Archive</title>
    <meta name="description" content="From PLUTO — A fan-made archive of Namtan, Film, and NamtanFilm events and activities.">
    <link rel="stylesheet" href="style.css">
</head>

<body class="home-page">

<div id="site-header"></div>

<main>

    <!-- HERO -->
    <section class="hero home-hero">
        <div class="container hero-inner">
            <div class="hero-text">
                <iframe class="youtube-video" src="https://www.youtube.com/embed/L0LOI8v7eWU?autoplay=1&mute=1&controls=1&rel=0&iv_load_policy=3" title="YouTube video player"
                frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>

            <div class="hero-decoration">
                 <img src="images/NFFC.png" alt="NamtanFilmFanCon" style="width:700px;">
            </div>
        </div>
    </section>
    
    <!-- UPCOMING -->
    <section class="upcoming-section">
        <div class="container">
            <div class="section-heading">
                <div>
                    <span class="eyebrow">UPCOMING</span>
                    <h2>Upcoming Events</h2>
                </div>
                <a href=/archive" class="section-link">
                    View Archive →
                </a>
            </div>
            <div id="upcomingEvents" class="upcoming-grid"></div>
        </div>
    </section>
</main>

<!-- INSTAGRAM -->
<section class="instagram-section">
    <div class="container">
         <div class="section-heading">
            <div>
                 <span class="eyebrow">INSTAGRAM</span>
                 <h2>Latest from Instagram</h2>
            </div>
        </div>
            <!-- NAMTAN -->
            <div class="instagram-row">
                <div class="instagram-row-header">
                    <a
                        href="https://www.instagram.com/namtan.tipnaree/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="instagram-username"
                    >
                        @namtan.tipnaree
                    </a>
                    <span class="instagram-arrow">
                        →
                    </span>
                </div>
                <div
                    id="instagramNamtan"
                    class="instagram-scroll"
                >
                    <!-- Instagram posts will be loaded here -->
                </div>

            </div>


            <!-- FILM -->
            <div class="instagram-row">
                <div class="instagram-row-header">
                    <a
                        href="https://www.instagram.com/fr.racha/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="instagram-username"
                    >
                        @fr.racha
                    </a>
                    <span class="instagram-arrow">
                        →
                    </span>
                </div>

                <div
                    id="instagramFilm"
                    class="instagram-scroll"
                >
                    <!-- Instagram posts will be loaded here -->
                </div>

            </div>


            <!-- LUNAR GMMTV -->
            <div class="instagram-row">
                <div class="instagram-row-header">
                    <a
                        href="https://www.instagram.com/lunar.gmmtv/"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="instagram-username"
                    >
                        @lunar.gmmtv
                    </a>
                    <span class="instagram-arrow">
                        →
                    </span>
                </div>

                <div
                    id="instagramLunar"
                    class="instagram-scroll"
                >
                    <!-- Instagram posts will be loaded here -->
                </div>
            </div>
        </div>
    </section>


<!-- EVENT MODAL -->
<div id="eventModal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
        <button class="modal-close" id="modalClose" aria-label="Close" type="button">
            ×
        </button>
        <div id="modalImage" class="modal-image">
            <div class="modal-image-placeholder">NF</div>
        </div>

        <div class="modal-body">
            <div class="modal-tags">
                <span id="modalArtist" class="tag"></span>
                <span id="modalType" class="tag"></span>
            </div>

            <h2 id="modalTitle"></h2>
            <div class="modal-info">
                <div class="info-row">
                    <span class="info-label">
                        DATE
                    </span>
                    <span id="modalDate"></span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        LOCATION
                    </span>
                    <span id="modalLocation"></span>
                </div>


                <div class="info-row">
                    <span class="info-label">
                        DESCRIPTION
                    </span>
                    <span id="modalDescription"></span>
                </div>
            </div>

            <a id="modalLink" class="modal-link hidden" href="#" target="_blank" rel="noopener noreferrer">
                View Related Link →
            </a>
        </div>
    </div>
</div>


<footer class="site-footer">

    <div class="container footer-inner">

        <span>
            FROM PLUTO ARCHIVE
        </span>

        <span>
            Fan-made archive · 2026
        </span>

    </div>

</footer>


<script src="app.js" defer></script>

</body>
</html>
